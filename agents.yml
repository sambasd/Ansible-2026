
---
- name: Install and configure Telegraf monitoring agent
  hosts: rhel_servers
  become: true

  tasks:

    # Step 1: Configure official InfluxData repository
    - name: Configure InfluxData repository
      ansible.builtin.yum_repository:
        name: influxdata
        description: InfluxData Stable Repository
        baseurl: https://repos.influxdata.com/stable/$basearch/main
        enabled: true
        gpgcheck: true
        gpgkey: https://repos.influxdata.com/influxdata-archive.key

    # Step 2: Import official GPG key
    - name: Import InfluxData GPG key
      ansible.builtin.rpm_key:
        state: present
        key: https://repos.influxdata.com/influxdata-archive.key
        fingerprint: 24C975CBA61A024EE1B631787C3D57159FC2F927

    # Step 3: Install Telegraf
    - name: Install Telegraf package
      ansible.builtin.dnf:
        name: telegraf
        state: present

    # Step 4: Create metrics directory
    - name: Create Telegraf log directory
      ansible.builtin.file:
        path: /var/log/telegraf
        state: directory
        owner: telegraf
        group: telegraf
        mode: '0755'

    # Step 5: Configure local metrics output
    - name: Configure Telegraf output
      ansible.builtin.copy:
        dest: /etc/telegraf/telegraf.d/output.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [[outputs.file]]
            files = ["/var/log/telegraf/metrics.out"]
            data_format = "influx"
      notify: Restart Telegraf

    # Step 6: Enable and start Telegraf
    - name: Enable and start Telegraf service
      ansible.builtin.systemd:
        name: telegraf
        enabled: true
        state: started

    # Step 7: Verify Telegraf service
    - name: Check Telegraf service
      ansible.builtin.command:
        cmd: systemctl is-active telegraf
      register: telegraf_status
      changed_when: false

    - name: Display Telegraf service status
      ansible.builtin.debug:
        msg: "Telegraf service status: {{ telegraf_status.stdout }}"

  handlers:
    - name: Restart Telegraf
      ansible.builtin.systemd:
        name: telegraf
        state: restarted

